[package]
name = "identity-lab"
version = "0.1.0"
edition = "2024"
license = { workspace = true }

[workspace.package]
license = "MIT or Apache-2.0"

[workspace]
resolver = "3"
members = [
  ".",
  "methods",
  "methods/guest",
  "crates/lez-client-gen",
]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }
# Align with lez-framework (guest + IDL macros); LEZ pin stays on `nssa` / `wallet` / `common`.
nssa_core = { git = "https://github.com/logos-blockchain/lssa.git", rev = "767b5afd388c7981bcdf6f5b5c80159607e07e5b" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }

risc0-zkvm = { version = "3.0.5", features = ["std"] }
risc0-build = "3.0.5"

lez-framework = { git = "https://github.com/jimmy-claw/lez-framework.git", rev = "1e146970d2bba861a32fd3a8b4e13b1e6ff4114d" }
lez-framework-core = { git = "https://github.com/jimmy-claw/lez-framework.git", rev = "1e146970d2bba861a32fd3a8b4e13b1e6ff4114d" }
lez-client-gen = { git = "https://github.com/jimmy-claw/lez-framework.git", rev = "1e146970d2bba861a32fd3a8b4e13b1e6ff4114d" }

hex = "0.4.3"
bytemuck = "1.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
clap = { version = "4.5.42", features = ["derive", "env"] }
tokio = { version = "1.28.2", features = ["macros", "net", "rt-multi-thread", "sync", "fs"] }
borsh = { version = "1.5", features = ["derive"] }
bincode = "1.3"

[dependencies]
nssa.workspace = true
nssa_core.workspace = true
wallet.workspace = true
common.workspace = true
lez-framework.workspace = true
lez-framework-core.workspace = true
example_program_deployment_methods = { path = "methods" }

serde.workspace = true
serde_json.workspace = true
risc0-zkvm.workspace = true
bincode.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros"] }

[[bin]]
name = "prove_age_gte_18"
path = "src/bin/prove_age_gte_18.rs"

[[bin]]
name = "run_identity_lab"
path = "src/bin/run_identity_lab.rs"
